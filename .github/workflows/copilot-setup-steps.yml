name: "Copilot Setup Steps"

# This workflow customizes the environment for GitHub Copilot coding agent
# It sets up the necessary environment variables and dependencies
# The job MUST be named "copilot-setup-steps" for Copilot to use it

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Set up Node.js for the MCP server
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Install Node.js dependencies for MCP server
      - name: Install Node dependencies
        run: npm ci
      
      # Build the MCP server
      - name: Build MCP server
        run: npm run build
      
      # Set up Python for the agent skill scripts
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # Install Python dependencies for agent skill scripts
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      # Make scripts executable
      - name: Make scripts executable
        run: |
          chmod +x .github/skills/nano-banana-assets/scripts/*.sh
          chmod +x .github/skills/nano-banana-assets/scripts/*.py
          chmod +x demo-agent-skill.sh
          chmod +x setup-api-key.sh
          chmod +x validate.sh
      
      # Set OPENROUTER_API_KEY from repository secret
      # To use this, add OPENROUTER_API_KEY to your repository secrets:
      # Settings -> Secrets and variables -> Actions -> New repository secret
      - name: Set OpenRouter API Key
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV
            echo "✅ OpenRouter API key set from repository secret"
          else
            echo "⚠️  OPENROUTER_API_KEY not found in repository secrets"
            echo "Add it in: Settings -> Secrets and variables -> Actions"
            echo "The skill will not work without an API key"
          fi
      
      # Set additional environment variables
      - name: Set additional environment variables
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "SKILL_PATH=.github/skills/nano-banana-assets" >> $GITHUB_ENV
      
      # Verify setup
      - name: Verify setup
        run: |
          echo "======================================"
          echo "GitHub Copilot Environment Setup"
          echo "======================================"
          echo ""
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Python version: $(python --version)"
          echo ""
          echo "Build status:"
          ls -lh dist/index.js
          echo ""
          echo "Skill location:"
          ls -lh .github/skills/nano-banana-assets/SKILL.md
          echo ""
          echo "Python scripts:"
          ls -lh .github/skills/nano-banana-assets/scripts/
          echo ""
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "✅ OPENROUTER_API_KEY is set"
            echo "   (First 20 chars: ${OPENROUTER_API_KEY:0:20}...)"
          else
            echo "⚠️  OPENROUTER_API_KEY is not set"
          fi
          echo ""
          echo "Environment ready for GitHub Copilot!"
          echo "======================================"
